<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>WeSki</title>
  <meta name="description" content="Jay Peak in 3D: trails, lifts, friends, directions and ski stats. Works offline." />
  <meta name="theme-color" content="#030b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WeSki" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="splash"><div class="splash-box"><img src="/icons/icon-192.png" alt="" width="84" height="84" /><h1>WeSki</h1><p id="splash-msg">Loading Jay Peak…</p></div></div>

  <section id="start" class="hidden">
    <div id="globe"></div>
    <div class="start-top"><h1>WeSki</h1><p>Choose your mountain</p></div>
    <div id="start-panel">
      <input class="field" id="f-resort" type="search" placeholder="Search resorts" autocomplete="off" autocorrect="off" spellcheck="false" />
      <div id="resort-list"></div>
    </div>
    <div id="resort-card" class="hidden"></div>
  </section>

  <header id="topbar">
    <div class="pill brand"><b>WeSki</b><span>Jay Peak</span></div>
    <div class="pills"><button class="pill" id="gps-pill" data-act="locate">GPS off</button><button class="pill hidden" id="group-pill" data-act="tab" data-tab="group"></button></div>
  </header>

  <section id="navbar" class="hidden"></section>

  <div id="fabs">
    <button id="mode-btn" data-act="mode" aria-label="Switch between 3D and 2D map">2D</button>
    <button data-act="locate" aria-label="Show my location"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg></button>
    <button data-act="weather" aria-label="Ski weather"><svg viewBox="0 0 24 24" width="23" height="23"><path d="M7 15.500a4 4 0 0 1 .6-7.960A5.500 5.500 0 0 1 18.200 9 3.300 3.300 0 0 1 17.500 15.500z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.500 19v.01M12 20.500v.01M15.500 19v.01" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/></svg></button>
    <button data-act="legend" aria-label="Map legend"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h3M4 12h3M4 18h3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M11 6h9M11 12h9M11 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>

  <section id="player" class="hidden"></section>
  <section id="sheet" class="hidden" aria-live="polite"><div class="sheet-head"><div class="grab"></div><h2 id="sheet-title"></h2><button class="x" data-act="close-sheet" aria-label="Close">✕</button></div><div id="sheet-body"></div></section>
  <div id="toast" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <canvas id="clouds" class="hidden"></canvas>

  <nav id="tabs">
    <button data-act="tab" data-tab="map" class="on"><svg viewBox="0 0 24 24"><path d="M2 20 9 7l4 6 3-4 6 11z" fill="currentColor"/></svg>Map</button>
    <button data-act="tab" data-tab="group"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5" fill="currentColor"/><circle cx="17" cy="9" r="2.8" fill="currentColor"/><path d="M1.5 20c0-4 3-6.5 6.500-6.500s6.500 2.500 6.500 6.500zM15 20c0-2.500-.8-4.300-2-5.600 4.500-1.400 9 .6 9 5.600z" fill="currentColor"/></svg>Group</button>
    <button data-act="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12 18 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Stats</button>
    <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>History</button>
    <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>More</button>
  </nav>

</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
