<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SkiWithMe</title>
  <meta name="description" content="Ski resorts in 3D: trails, lifts, friends, spoken directions and ski stats. Works offline." />
  <meta name="theme-color" content="#030b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SkiWithMe" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="splash"><div class="splash-box"><img src="/icons/icon-192.png" alt="" width="84" height="84" /><h1>SkiWithMe</h1><p id="splash-msg">Loading…</p></div></div>

  <section id="start" class="hidden">
    <div class="start-sky" aria-hidden="true"></div>
    <div id="globe"></div>
    <button id="globe-out" class="globe-out hidden" data-act="globe-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.300 15.300 20 20M7.500 10.500h6"/></svg></button>
    <div class="start-top"><h1 class="start-title" translate="no">SkiWithMe</h1><p class="start-slogan">Your mountain. Your crew.</p></div>
    <div id="start-panel">
      <div class="grab"></div>
      <div class="start-head"><h2>Find your mountain</h2><button id="acct-chip" class="acct-chip hidden" data-act="acct-chip"></button></div>
      <label class="search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.500 15.500 21 21"/></svg><input id="f-resort" type="search" placeholder="Search mountains or regions" autocomplete="off" autocorrect="off" spellcheck="false" /></label>
      <div class="start-filters"><button data-act="near-me" id="near-btn"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.500-6.200-6.500-11a6.500 6.500 0 0 1 13 0c0 4.800-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.300"/></svg>Use my location</button><span class="sep"></span><button data-act="favs" id="fav-btn"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.200l2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 17l-5.400 2.900 1.100-6.100L3.200 9.600l6.100-.8z"/></svg>Favorites</button><span class="sep"></span><button data-act="start-hist" id="hist-btn"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>History</button></div>
      <div id="resort-list"></div>
    </div>
    <div class="start-actions"><button class="btn outline join-btn" data-act="start-join">Join Group</button><button class="btn outline join-btn" data-act="start-forecast">Forecast</button></div>
    <div id="resort-card" class="hidden"></div>
  </section>

  <div id="headbg"></div>
  <header id="topbar">
    <button class="elev" id="elev" data-act="locate" aria-label="Elevation. Tap to show my location"><span>Elevation</span><b id="elev-val">GPS OFF</b></button>
    <div class="pills">      <button class="resort-btn" id="resort-btn" data-act="change-resort" aria-label="Change mountain"><svg viewBox="0 0 64 32" width="52" height="26"><path d="M0 30 18 12l6 5 12-14 28 27z" fill="#5d7f9e"/><path d="M36 3l8 10-5-1-3 4-3-5-5 3z M18 12l5 5-4-1-2 2-2-3z" fill="#eef4fa"/><path d="M36 3 64 30H40z" fill="#000" opacity=".18"/></svg><span id="resort-btn-name"></span><i>›</i></button>
      <button class="pill hidden" id="gps-pill" data-act="locate">GPS off</button><button class="pill hidden" id="free-pill" data-act="simfree-off" aria-label="Free tier simulation: tap to turn off"></button><button class="pill hidden" id="group-pill" data-act="tab" data-tab="group"></button></div>
  </header>

  <section id="navbar" class="hidden"></section>

  <div id="fabs">
    <button id="sos-btn" class="sos" data-act="sos" aria-label="Emergency: ski patrol and emergency numbers"><b translate="no">SOS</b></button>
    <button id="mode-btn" data-act="mode" aria-label="Switch between 3D and 2D map">2D</button>
    <button data-act="locate" aria-label="Show my location"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg></button>
    <button data-act="pocket" aria-label="Pocket mode: lock the screen, keep GPS and voice on"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="1.800" width="8" height="12" rx="1.600"/><path d="M11 4h2"/><path d="M3.500 9.500h17V15a6 6 0 0 1-6 6h-5a6 6 0 0 1-6-6z" fill="var(--fab-bg, #10263d)"/><path d="M7 13.500c1.600 1.300 3.200 1.900 5 1.900s3.400-.6 5-1.900"/></svg></button>
    <button data-act="report-fab" aria-label="Report a map mistake"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 4.500c3-1.600 5.500 1.600 8.500 0s4.500-.8 5.500 0v8c-1-.8-2.500-1.600-5.500 0s-5.500-1.600-8.500 0"/></svg></button>
    <button data-act="legend" aria-label="Map legend"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.500 9 4l6 2.500L21 4v13.500L15 20l-6-2.500L3 20z"/><path d="M9 4v13.500M15 6.500V20"/></svg></button>
  </div>

  <button id="searchbtn" class="hidden" data-act="search" aria-label="Search this mountain"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.500 15.500 21 21"/></svg></button>
  <button id="infobar" class="hidden" data-act="weather" aria-label="Mountain weather"><span class="nm" id="info-name"></span><span class="wx" id="info-wx"></span></button>
  <section id="player" class="hidden"></section>
  <section id="sheet" class="hidden" aria-live="polite"><div class="sheet-head"><div class="grab"></div><svg class="peaks" viewBox="0 0 260 80" preserveAspectRatio="xMaxYMax meet" aria-hidden="true"><path d="M0 79 60 70 92 58 118 64 150 40 172 50 196 22 224 46 260 60V80H0z" fill="#3c5a78" opacity=".55"/><path d="M92 58 118 64 150 40z" fill="#7d9bb8" opacity=".6"/><path d="M150 40 172 50 196 22z" fill="#a9c2da" opacity=".75"/><path d="M196 22 224 46 260 60 214 52z" fill="#5f7f9f" opacity=".7"/><path d="M196 22 205 34 196 31 188 37z" fill="#f2f7fc"/><path d="M150 40 157 47 149 45 144 49z" fill="#e3edf6" opacity=".9"/><path d="M118 64 150 40 160 60z" fill="#2c4865" opacity=".7"/><path d="M172 50 196 22 190 60z" fill="#47678a" opacity=".6"/></svg><h2 id="sheet-title"></h2><button class="x" data-act="close-sheet" aria-label="Close">✕</button></div><div id="sheet-body"></div></section>
  <div id="toast" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <canvas id="clouds" class="hidden"></canvas>
  <div id="pocket" class="hidden" role="button" aria-label="Pocket mode. Press and hold to unlock"><div><b>Pocket mode</b><span>Voice directions and GPS stay on.<br>Press and hold to unlock.</span><i></i></div></div>

  <div id="fc-live" class="sr" role="status" aria-live="polite"></div>
  <nav id="tabs">
    <button data-act="tab" data-tab="map" class="on"><svg viewBox="0 0 24 24"><path d="M2 20 9 7l4 6 3-4 6 11z" fill="currentColor"/></svg>Map</button>
    <button data-act="tab" data-tab="group"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5" fill="currentColor"/><circle cx="17" cy="9" r="2.8" fill="currentColor"/><path d="M1.5 20c0-4 3-6.5 6.500-6.500s6.500 2.500 6.500 6.500zM15 20c0-2.500-.8-4.300-2-5.600 4.500-1.400 9 .6 9 5.600z" fill="currentColor"/></svg>Group</button>
    <button data-act="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12 18 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Stats</button>
    <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>History</button>
    <button data-act="tab" data-tab="forecast"><svg viewBox="0 0 24 24"><path d="M6 17a4 4 0 0 1 .6-7.950A5.500 5.500 0 0 1 17 8.500 4.300 4.300 0 0 1 17.500 17z" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/><path d="M9 20.500v.5M13 20.500v.5M17 20.500v.5" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></svg>Forecast</button>
    <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>More</button>
  </nav>

</div>
<div id="rotate" aria-live="polite"><div><svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="8" width="24" height="44" rx="5"/><path d="M29 46h6"/><path d="M52 22a22 22 0 0 1 0 20M48 38l4 4 4-4"/></svg><b>Turn your phone upright</b><span>SkiWithMe is made for holding your phone upright.</span></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
