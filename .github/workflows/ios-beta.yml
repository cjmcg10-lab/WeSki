name: iPhone beta
on:
  push:
    branches: [ios/testflight-beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skiwithme-ios-beta
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test the ski app
        run: |
          npm ci
          mkdir -p public/data/sunday-river
          for file in resort.json graph.json terrain.bin; do
            curl --fail --retry 3 --silent --show-error "https://skiwithme.builtbyroger.app/data/sunday-river/$file" -o "public/data/sunday-river/$file"
          done
          node --input-type=module -e 'import fs from "node:fs"; const dir="public/data/sunday-river/"; const resort=JSON.parse(fs.readFileSync(dir+"resort.json")); resort.graph=JSON.parse(fs.readFileSync(dir+"graph.json")); fs.writeFileSync(dir+"resort.json",JSON.stringify(resort));'
          npm test
          node tools/maps_r2.mjs drop
      - name: Package the free beta and configure Xcode
        run: |
          npm install --prefix ios-beta --no-audit --no-fund
          node ios-beta/prepare.mjs
          npm run build:assets
          mv dist ios-beta/www
          cd ios-beta
          npx --no-install cap add ios
          python3 -m venv "$RUNNER_TEMP/icon-tools"
          "$RUNNER_TEMP/icon-tools/bin/pip" install Pillow
          "$RUNNER_TEMP/icon-tools/bin/python" configure.py
      - name: Build for iPhone
        working-directory: ios-beta
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/iphone" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/iphone/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/SkiWithMe-unsigned.zip"
      - name: Launch on iPhone Simulator
        working-directory: ios-beta
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device" app.builtbyroger.skiwithme
          sleep 10
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/SkiWithMe-launch.png"
      - uses: actions/upload-artifact@v4
        with:
          name: SkiWithMe-beta
          path: |
            ${{ runner.temp }}/SkiWithMe-unsigned.zip
            ${{ runner.temp }}/SkiWithMe-launch.png
